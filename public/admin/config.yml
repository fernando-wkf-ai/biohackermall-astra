{
  "backend": {
    "name": "github",
    "repo": "",
    "branch": "main",
    "base_url": "",
    "auth_endpoint": "auth"
  },
  "publish_mode": "editorial_workflow",
  "media_folder": "public/uploads",
  "public_folder": "/uploads",
  "site_url": "https://biohackermall.com",
  "collections": [
    {
      "name": "articles_en",
      "label": "English articles",
      "folder": "content/en",
      "create": true,
      "format": "frontmatter",
      "extension": "md",
      "slug": "{{slug}}",
      "summary": "{{title}}",
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "widget": "string"
        },
        {
          "name": "slug",
          "label": "URL slug",
          "widget": "string"
        },
        {
          "name": "translation_key",
          "label": "Translation pair ID",
          "widget": "string"
        },
        {
          "name": "excerpt",
          "label": "Short introduction",
          "widget": "text"
        },
        {
          "name": "category",
          "label": "Product category",
          "widget": "string"
        },
        {
          "name": "type",
          "label": "Content type",
          "widget": "select",
          "options": [
            "article",
            "comparison",
            "buying-guide",
            "explainer",
            "product-update",
            "decision-guide",
            "news"
          ]
        },
        {
          "name": "tags",
          "widget": "list"
        },
        {
          "name": "author",
          "label": "Author",
          "widget": "string"
        },
        {
          "name": "published_date",
          "label": "published date",
          "widget": "datetime",
          "format": "YYYY-MM-DD",
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "required": true
        },
        {
          "name": "updated_date",
          "label": "updated date",
          "widget": "datetime",
          "format": "YYYY-MM-DD",
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "required": true
        },
        {
          "name": "last_verified_date",
          "label": "last verified date",
          "widget": "datetime",
          "format": "YYYY-MM-DD",
          "date_format": "YYYY-MM-DD",
          "time_format": false,
          "required": false
        },
        {
          "name": "locale",
          "widget": "hidden",
          "default": "en"
        },
        {
          "name": "seo_title",
          "label": "Search engine title",
          "widget": "string"
        },
        {
          "name": "meta_description",
          "label": "Search engine description",
          "widget": "text"
        },
        {
          "name": "sources",
          "label": "Official sources",
          "widget": "list",
          "fields": [
            {
              "name": "label",
              "label": "Source name",
              "widget": "string"
            },
            {
              "name": "url",
              "label": "Official HTTPS URL",
              "widget": "string"
            }
          ]
        },
        {
          "name": "affiliate_disclosure",
          "label": "Show affiliate disclosure",
          "widget": "boolean",
          "default": true
        },
        {
          "name": "schema_type",
          "widget": "hidden",
          "default": "Article"
        },
        {
          "name": "published",
          "label": "Published on site",
          "widget": "boolean",
          "default": false
        },
        {
          "name": "body",
          "label": "Article",
          "widget": "markdown"
        }
      ]
    },
